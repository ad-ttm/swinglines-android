name: Build SwingLines APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Restore shared signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SWINGLINES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SWINGLINES_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/swinglines.keystore
          echo "Keystore restored, $(stat -c%s signing/swinglines.keystore) bytes"

      - name: Build debug APK
        env:
          SWINGLINES_STORE_PASSWORD: ${{ secrets.SWINGLINES_STORE_PASSWORD }}
          SWINGLINES_KEY_ALIAS: ${{ secrets.SWINGLINES_KEY_ALIAS }}
          SWINGLINES_KEY_PASSWORD: ${{ secrets.SWINGLINES_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Confirm APK is signed with the shared key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          # A silent fallback to the auto-generated debug key would still produce
          # a valid APK, but it would not install as an update over previous
          # builds. That key is always CN=Android Debug, so treat it as a failure.
          if grep -q "CN=Android Debug" certs.txt; then
            echo "APK was signed with the throwaway debug key, not the shared key" >&2
            exit 1
          fi

      - name: Remove signing key from workspace
        if: always()
        run: rm -f signing/swinglines.keystore

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk SwingLines-v${VERSION}-build${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwingLines-APK
          path: SwingLines-*.apk

      - name: Publish release (phone-friendly download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SwingLines build ${{ github.run_number }}
          body: "Debug APK - install directly on Android (allow 'unknown sources' when prompted)."
          files: SwingLines-*.apk
